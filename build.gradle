plugins {
    id 'net.minecraftforge.gradle' version '6.+'
}

version = "${mod_version}"
group = "${mod_group_id}"
archivesBaseName = 'overmek'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
    compileJava.options.encoding = 'UTF-8'
}

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            arg '-mixin.config=overmek.mixins.json'
            mods {
                overmek { source sourceSets.main }
            }
        }
        server {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'info'
            arg '-mixin.config=overmek.mixins.json'
            mods {
                overmek { source sourceSets.main }
            }
        }
    }
}

repositories {
    maven {
        name = "ModMaven"
        url = "https://modmaven.dev/"
    }
    maven {
        name = "BlameJared Maven"
        url = "https://maven.blamejared.com/"
    }
    maven {
        name = "Modrinth Maven"
        url = "https://api.modrinth.com/maven"
        content { includeGroup "maven.modrinth" }
    }
    flatDir {
        dir 'libs'
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Use the full Mekanism bundle so generator classes are available at compile time.
    implementation fg.deobf("mekanism:Mekanism:1.20.1-10.4.16.80:all")

    // AE2 (Applied Energistics 2) - from local libs
    compileOnly fg.deobf("libs:appliedenergistics2-forge:${ae2_version}")

    // Extended AE - AE2 addon
    compileOnly fg.deobf("libs:ExtendedAE:" + extended_ae_version)

    // Applied Mekanistics - AE2 + Mekanism integration
    compileOnly fg.deobf("libs:Applied-Mekanistics:" + applied_mekanistics_version)

    // Mekanism More Machine - local runtime for dev verification
    runtimeOnly fg.deobf("libs:mekmm-1.20.1-dev:1.2.1")

    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // JEI for dev runtime and recipe viewing
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge-api:${jei_version}")
    runtimeOnly fg.deobf("mezz.jei:jei-${minecraft_version}-forge:${jei_version}")
}

processResources {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            forge_version_range    : forge_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

jar {
    manifest {
        attributes([
            "Specification-Title"   : "overmek",
            "Specification-Vendor"  : "hewiegui",
            "Specification-Version" : "1",
            "Implementation-Title"  : project.name,
            "Implementation-Version": project.jar.archiveVersion,
            "Implementation-Vendor" : "hewiegui",
            "MixinConfigs"          : "overmek.mixins.json"
        ])
    }
}
