modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
displayTest="MATCH_VERSION"
description='''${mod_description}'''

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanism"
mandatory=false
versionRange="[10.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="mekanismgenerators"
mandatory=false
versionRange="[10.4,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ae2"
mandatory=false
versionRange="[15.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="expatternprovider"
mandatory=false
versionRange="[1.0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="appmek"
mandatory=false
